services:
  - type: web
    name: newflow-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:application
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NEWFLOW_ENV
        value: production
      - key: NEWFLOW_DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER
        sync: false
  - type: cron
    name: newflow-ai-daily-digest
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.daily_digest
    schedule: "0 12 * * *"
    envVars:
      - key: NEWFLOW_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER
        sync: false
      - key: DAILY_DIGEST_RECIPIENT
        sync: false
      - key: DAILY_DIGEST_INTERESTS
        sync: false
      - key: YOUTUBE_CHANNEL_IDS
        sync: false
